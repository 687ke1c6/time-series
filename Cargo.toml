[package]
name = "time-series"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "compression-full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros", "chrono"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }

[dev-dependencies]
tower = { version = "0.5.3", default-features = false, features = ["util"] }
